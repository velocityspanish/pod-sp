name: Velocity Spanish Podcast - Daily Upload

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation fonts-noto-color-emoji
          sudo fc-cache -fv
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env
        run: |
          echo "POLLINATIONS_API_KEY=${ secrets.POLLINATIONS_API_KEY }" >> .env
          echo "AI_MODEL=${ secrets.AI_MODEL || 'openai' }" >> .env
          echo "YT_CLIENT_ID=${ secrets.YT_CLIENT_ID }" >> .env
          echo "YT_CLIENT_SECRET=${ secrets.YT_CLIENT_SECRET }" >> .env
          echo "YT_REFRESH_TOKEN=${ secrets.YT_REFRESH_TOKEN }" >> .env
          echo "FACEBOOK_ACCESS_TOKEN=${ secrets.FACEBOOK_ACCESS_TOKEN }" >> .env
          echo "FACEBOOK_PAGE_ID=${ secrets.FACEBOOK_PAGE_ID }" >> .env

      - name: Generate podcast
        run: python podcast_generator.py

      - name: Upload to YouTube
        env:
          YT_CLIENT_ID: ${ secrets.YT_CLIENT_ID }
          YT_CLIENT_SECRET: ${ secrets.YT_CLIENT_SECRET }
          YT_REFRESH_TOKEN: ${ secrets.YT_REFRESH_TOKEN }
        run: |
          export PYTHONPATH="${ github.workspace }:$PYTHONPATH"
          python upload_to_youtube.py
          python set_channel_description.py

      - name: 📘 Upload to Facebook Page
        continue-on-error: true
        env:
          FACEBOOK_ACCESS_TOKEN: ${ secrets.FACEBOOK_ACCESS_TOKEN }
          FACEBOOK_PAGE_ID: ${ secrets.FACEBOOK_PAGE_ID }
        run: |
          export PYTHONPATH="${ github.workspace }:$PYTHONPATH"
          if [ -f "upload_to_facebook.py" ]; then
            python upload_to_facebook.py
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: podcast-video-${ github.run_number }
          path: |
            output/podcast_*/podcast_final.mp4
            output/podcast_*/thumbnail.jpg
            output/podcast_*/facebook_upload_result.json
            output/latest_upload_info.json
          retention-days: 7
